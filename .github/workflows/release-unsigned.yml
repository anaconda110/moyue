# Unsigned first-release path: Linux AppImage + Windows NSIS, published to a
# GitHub Release. Signing/notarization/Android need repository secrets this
# fork does not have yet; the signed release.yml stays the eventual path.
#
# The release body carries <!-- unsigned-build --> so release.yml's
# `release: published` trigger skips it instead of failing on missing secrets.
name: Release Moyue (unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in apps/readest-app/package.json
        required: true
        default: '0.12.22'
      tag:
        description: Release tag
        required: true
        default: 'v0.12.22'
      ref:
        description: Branch or commit to build
        required: true
        default: 'recovery/ai-stats'

permissions:
  contents: read

concurrency:
  group: release-unsigned-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: verify the requested version
        run: |
          set -euo pipefail
          actual=$(node -p "require('./apps/readest-app/package.json').version")
          expected='${{ inputs.version }}'
          if [ "$actual" != "$expected" ]; then
            echo "::error::package.json is $actual, expected $expected"
            exit 1
          fi
      - name: create or reuse the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          notes='Unsigned Linux and Windows build. Installers are not code-signed or notarized, and automatic updates are not available from this release.

          <!-- unsigned-build -->'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Moyue $tag (unsigned build)" --notes "$notes"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target '${{ inputs.ref }}' --draft \
              --title "Moyue $tag (unsigned build)" --notes "$notes"
          fi
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage --config src-tauri/tauri.unsigned.conf.json
            artifact_path: target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.unsigned.conf.json
            artifact_path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: release-unsigned-${{ matrix.name }}-cargo

      - name: install the CEF tauri CLI from readest/tauri (linux only)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          rev=6beeb209b5514f597a26f48b7a5b9fe4c59b5f12
          marker="$HOME/.cargo/bin/.cargo-tauri-rev"
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ] && [ "$(cat "$marker" 2>/dev/null)" = "$rev" ]; then
            echo "cargo-tauri at $rev already installed"
            exit 0
          fi
          cargo install tauri-cli --git https://github.com/readest/tauri --rev "$rev" --locked --force
          echo "$rev" > "$marker"

      - name: install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libclang-dev g++ libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: stage CEF AppImage runtime libraries (linux only)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          sudo apt-get install -y libnss3 libpulse0 libspeechd2 libxkbcommon-x11-0
          nss_dir=$(dirname "$(ls /usr/lib/*-linux-gnu/nss/libsoftokn3.so)")
          lib_dir=${nss_dir%/nss}
          sudo cp -f --remove-destination "$nss_dir"/*.so "$lib_dir/"
          conf=apps/readest-app/src-tauri/tauri.conf.json
          jq --arg d "$lib_dir" '.bundle.linux.appimage.files += {
              "/usr/lib/libspeechd.so.2": ($d + "/libspeechd.so.2"),
              "/usr/lib/libxkbcommon-x11.so.0": ($d + "/libxkbcommon-x11.so.0")
            }' "$conf" > "$conf.tmp" && mv "$conf.tmp" "$conf"

      - name: create .env.local for Next.js
        shell: bash
        run: |
          echo "NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env.local
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .env.local
          echo "SENTRY_ORG=readest" >> .env.local
          echo "SENTRY_PROJECT=readest" >> .env.local
          cp .env.local apps/readest-app/.env.local

      - name: build desktop bundle
        shell: bash
        timeout-minutes: 90
        env:
          TAURI_CEF_CARGO: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
          STRACE_MODE: '0'
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          cd apps/readest-app
          pnpm tauri build ${{ matrix.args }}

      - name: upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: upload installers and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.tag }}'
          ls -l dist
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
